[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solfaflow"
version = "0.1.0"
description = "Audio-to-tonic-solfa transcription tools"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["solfaflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
